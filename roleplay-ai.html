<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務角色扮演 AI 練習器</title>
  <meta name="description" content="與 AI 客戶即時對話練習銷售話術：隨機組合產業、角色、情境與難度，練習後獲得 AI 教練的覆盤報告。">
  <meta name="theme-color" content="#0a0e1a">
  <meta property="og:title" content="業務角色扮演 AI 練習器">
  <meta property="og:description" content="與 AI 客戶即時對話練習銷售話術，並獲得 AI 教練覆盤報告。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body { background: #0a0e1a; color: white; min-height: 100vh; }
    input::placeholder { color: rgba(255,255,255,0.3); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.35); border-radius: 4px; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeInDown { from { opacity:0; transform:translate(-50%,-10px); } to { opacity:1; transform:translate(-50%,0); } }
    @keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100% { box-shadow:0 0 20px rgba(99,102,241,0.4); } 50% { box-shadow:0 0 40px rgba(99,102,241,0.7); } }
    #root { min-height: 100vh; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script defer src="./js/roleplay-ai.min.js"></script>
</body>
</html>
